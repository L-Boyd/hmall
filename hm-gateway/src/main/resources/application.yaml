server:
  port: 8080

spring:
  application:
    name: gateway

  profiles:
    active: dev

  cloud:
    nacos:
      server-addr: ${hm.nacos.address}

    gateway:
      routes:
        - id: item-service  # 路由唯一标识
          uri: lb://item-service # 路由目标,lb代表负载均衡
          predicates: # 断言/路由规则
            - Path=/items/**, /search/**
          filters:
            - AddRequestHeader=truth, where is a will where is a way

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/addresses/**, /users/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/carts/**

        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/orders/**

        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**
      default-filters:
        - AddRequestHeader=default-filters-k, default-filters-v
        - PrintAny
        - PrintAnySecond=1,2,3

hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi