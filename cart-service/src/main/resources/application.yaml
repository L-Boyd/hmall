server:
  port: 8082
  tomcat:
    threads:
      max: 25 # 允许最大线程数
    accept-count: 25 # 线程占满后，请求队列最大长度
    max-connections: 100 # 最大连接数
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi
# keytool -genkeypair -alias hmall -keyalg RSA -keypass hmall123 -keystore hmall.jks -storepass hmall123

feign:
  okhttp:
    enabled: true
  sentinel:
    enabled: true # 开启 sentinel 对 feign 的支持

spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8090 #  sentinel 控制台地址
      http-method-specify: true # 显示请求方式前缀
