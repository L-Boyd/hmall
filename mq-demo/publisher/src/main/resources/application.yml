logging:
  pattern:
    dateformat: MM-dd HH:mm:ss:SSS
  level:
    com.itheima: debug
spring:
  rabbitmq:
    host: 192.168.1.10
    port: 5672
    virtual-host: /hmall  # 虚拟主机
    username: hmall
    password: ${rabbitmq.password}
    connection-timeout: 1s    # 连接超时时间
    template:
      retry:
        enabled: true    # 开启超时重试机制
        initial-interval: 1000ms    # 失败后初次等待时间
        multiplier: 1    # 失败后下次的等待时长倍数，下次等待时长 = initial-interval * multiplier
        max-attempts: 3    # 最大重试次数
    publisher-confirm-type: correlated  # 开启publisher confirm机制，并设置confirm类型。none：不开启，simple：同步阻塞等待mq的回执消息，correlated：mq异步回调方式返回回执消息
    publisher-returns: true # 开启publisher return机制